# Generates the stats and project cards used in README.md and saves them in /profile.
# Runs every day and whenever this file changes.
# To run it by hand: Actions -> "Update README cards" -> Run workflow.
name: Update README cards

on:
  push:
    paths:
      - .github/workflows/readme-cards.yml # regenerate the cards right away when this file changes
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # lets the workflow commit the generated SVGs

    env:
      # Same colors as before: navy background, blue accents
      COLORS: bg_color=0b1d3a&title_color=58a6ff&icon_color=58a6ff&text_color=c9d1d9&border_color=1f6feb

    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&${{ env.COLORS }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true # if GitHub's API has a bad day, keep the old card instead of saving an error card

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # "normal" layout, so this card is as tall as the stats card next to it
          options: username=${{ github.repository_owner }}&layout=normal&${{ env.COLORS }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # Both project cards reserve 3 lines for the description, so they are the same height
      - name: PassForge card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=pass-forge&description_lines_count=3&${{ env.COLORS }}
          path: profile/pin-pass-forge.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: ImageOnMapReborn card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ImageOnMapReborn&description_lines_count=3&${{ env.COLORS }}
          path: profile/pin-imageonmapreborn.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
